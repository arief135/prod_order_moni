# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: id.integrasolution.arisa.prodordermoni
type: application
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://my424750.s4hana.cloud.sap/
          authenticationType: reentranceTicket # SAML support for vscode
        app:
          name: ZPRODORDERMONI1
          description: Monitoring Production Order
          package: ZCUST_APP_002
          transport: env:TRANSPORT_REQUEST
        exclude:
          - /test/
  resources:
    excludes:
      - /test/**
      - /localService/**
